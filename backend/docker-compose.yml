name: ${COMPOSE_PROJECT_NAME:-red_bean}

services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in backend/.env.local}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env.local}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in backend/.env.local}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - red_bean_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env.local}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env.local}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - red_bean_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in backend/.env.local}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in backend/.env.local}"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000" # API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001" # Console（浏览器访问 http://localhost:9001）
    volumes:
      - red_bean_minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  red_bean_postgres_data:
  red_bean_redis_data:
  red_bean_minio_data:
